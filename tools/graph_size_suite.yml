suite: supported-graph-size
conformance:
  - {id: completeness, check: completeness, with: {label: Customer, property: email}}
  - id: cardinality
    check: cardinality
    with: {from_label: Account, rel_type: OWNS, to_label: Customer, direction: in, exactly: 1}
  - {id: no_orphans, check: no_orphans, with: {label: Account}}
  - {id: dangling_rels, check: dangling_rels, with: {}}
  - {id: property_type, check: property_type, with: {label: Account, property: balance, type: integer}}
  - id: property_format
    check: property_format
    with: {label: Customer, property: email, regex: '^[^@\s]+@[^@\s]+\.[^@\s]+$'}
  - id: value_in_set
    check: value_in_set
    with: {label: Account, property: type, values: [shell, savings, checking]}
  - {id: uniqueness, check: uniqueness, with: {label: Customer, property: id}}
  - {id: hub_outlier, check: hub_outlier, with: {label: Customer}}
  - id: label_cooccurrence
    check: label_cooccurrence
    with: {label_a: Customer, label_b: Account}
  - id: rel_direction
    check: rel_direction
    with: {from_label: Customer, rel_type: OWNS, to_label: Account}
  - id: temporal_sanity
    check: temporal_sanity
    with: {label: Transaction, start_property: ts, end_property: settled_at}
  - {id: pii_name_match, check: pii_name_match, with: {}}
  - {id: pii_value_match, check: pii_value_match, with: {}}
