suite: benchmark-remediations
generated: true
competency:
  - id: owner-evidence
    question: Does each Account have at most one incoming OWNS relationship?
    query: |
      MATCH (a:Account)
      OPTIONAL MATCH (:Customer)-[r:OWNS]->(a)
      WITH a, count(r) AS owners
      WHERE owners > 1
      RETURN a, owners
    expect: {empty: true}
  - id: regression-projection
    question: Does the leader reach both required Account IDs?
    query: |
      MATCH (:Customer {id: $customer_id})-[:CONTROLS*1..4]->(a:Account)
      RETURN DISTINCT a.id AS account_id
    params: {customer_id: CUST-RING-LEADER-0}
    expect: {contains: [ACC-2401, ACC-2408]}
  - id: aggregate-witness
    question: Is the total Customer count exactly 1500?
    query: |
      MATCH (c:Customer)
      WITH count(c) AS actual_count
      WHERE actual_count <> $expected_count
      OPTIONAL MATCH (witness:Customer)
      RETURN witness, actual_count
      LIMIT 1
    params: {expected_count: 1500}
    expect: {empty: true}
conformance:
  - id: incoming-sender-scope
    check: cardinality
    with: {from_label: Transaction, rel_type: SENT, to_label: Account, direction: in, exactly: 1}
