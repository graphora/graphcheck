[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphcheck"
dynamic = ["version"]
description = "Semantic observability for property graphs."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Graphora" }]
keywords = [
    "neo4j",
    "knowledge-graph",
    "graph-database",
    "cypher",
    "data-quality",
    "testing",
    "observability",
    "graphrag",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "neo4j>=5.20,<7",
    "prometheus-client>=0.20",
    "rich>=13",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "filelock>=3.12",
    "jsonschema>=4",
]

[project.optional-dependencies]
generate = ["instructor[anthropic,google-genai]==1.15.4"]
mcp = ["mcp>=2.0.0,<3"]

[project.scripts]
graphcheck = "graphcheck.bootstrap:cli"

[project.urls]
Homepage = "https://github.com/graphora/graphcheck"
Repository = "https://github.com/graphora/graphcheck"
Issues = "https://github.com/graphora/graphcheck/issues"
Changelog = "https://github.com/graphora/graphcheck/blob/development/CHANGELOG.md"

[dependency-groups]
dev = [
    "instructor[anthropic,google-genai]==1.15.4",
    "mcp>=2.0.0,<3",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff==0.16.0",
    "pre-commit>=3.7",
    "testcontainers[neo4j]>=4.8",
]

[tool.hatch.version]
path = "src/graphcheck/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/graphcheck"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures/external"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# This module embeds the complete offline HTML/CSS/JavaScript document. Keeping template lines
# intact makes the generated page reviewable; Ruff still checks every rule other than line length.
"src/graphcheck/reporting/html.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: opt-in performance budget tests against a preloaded customer-scale graph",
    "hostile: real CLI coverage against the hostile graph certification set",
    "hostile_scale: opt-in public dataset scale certification",
]
# Coverage is enforced in CI (.github/workflows/ci.yml), not here — so focused
# `pytest -k ...` runs don't trip the package-wide 80% gate.
