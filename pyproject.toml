[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphcheck"
version = "0.1.0"
description = "Semantic observability for property graphs — pytest for knowledge graphs."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "instructor[anthropic,google-genai]==1.15.4",
    "neo4j>=5.20,<7",
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
graphcheck = "graphcheck.bootstrap:cli"

[dependency-groups]
dev = [
    "jsonschema>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff==0.16.0",
    "pre-commit>=3.7",
    "testcontainers[neo4j]>=4.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graphcheck"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# This module embeds the complete offline HTML/CSS/JavaScript document. Keeping template lines
# intact makes the generated page reviewable; Ruff still checks every rule other than line length.
"src/graphcheck/reporting/html.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "performance: opt-in performance budget tests against a preloaded customer-scale graph",
]
# Coverage is enforced in CI (.github/workflows/ci.yml), not here — so focused
# `pytest -k ...` runs don't trip the package-wide 80% gate.
