name: 'GraphCheck'
description: 'Run GraphCheck checks against your graph and report results in the PR.'

inputs:
  profile:
    description: 'Profile name to generate and use, if profiles.yml does not already exist'
    required: false
    default: 'ci'
  uri:
    description: 'Neo4j Bolt URI (e.g. bolt://localhost:7687)'
    required: true
  user:
    description: 'Neo4j username'
    required: true
  database:
    description: 'Neo4j database name'
    required: false
    default: 'neo4j'
  fail-fast:
    description: 'Stop on the first failing check'
    required: false
    default: 'false'
  suite:
    description: 'Run only this suite id (optional; runs all suites if not set)'
    required: false
    default: ''
  concurrency:
    description: 'Maximum concurrent checks; empty uses graphcheck.yml'
    required: false
    default: ''
  upload-artifacts:
    description: 'Upload results always, only on failure, or never'
    required: false
    default: 'always'
  version:
    description: 'Exact GraphCheck version to install (e.g. 0.1.0)'
    required: false
    default: '0.1.0'

runs:
  using: 'composite'
  steps:
    - name: Set up cached uv and Python
      if: inputs.version != ''
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
        enable-cache: true
        cache-suffix: graphcheck-action
        prune-cache: false

    - name: Install GraphCheck
      shell: bash
      env:
        GC_VERSION: ${{ inputs.version }}
      run: |
        if [ -z "$GC_VERSION" ]; then
          echo "version empty — using pre-installed graphcheck"
        else
          venv="$RUNNER_TEMP/graphcheck-action-venv"
          uv venv "$venv" --python 3.12
          uv pip install --python "$venv" --only-binary :all: "graphcheck==$GC_VERSION"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tool_bin=$(cygpath -w "$venv/Scripts")
            tool_python=$(cygpath -u "$venv/Scripts/python.exe")
            echo "$tool_bin" >> "$GITHUB_PATH"
            echo "GRAPHCHECK_ACTION_PYTHON=$tool_python" >> "$GITHUB_ENV"
          else
            echo "$venv/bin" >> "$GITHUB_PATH"
            echo "GRAPHCHECK_ACTION_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
          fi
        fi

    - name: Prepare GraphCheck
      id: generate_profile
      shell: bash
      env:
        GC_PROFILE: ${{ inputs.profile }}
        GC_URI: ${{ inputs.uri }}
        GC_USER: ${{ inputs.user }}
        GC_DATABASE: ${{ inputs.database }}
        GC_CONCURRENCY: ${{ inputs.concurrency }}
        GC_UPLOAD_ARTIFACTS: ${{ inputs.upload-artifacts }}
      run: '"${GRAPHCHECK_ACTION_PYTHON:-python}" "${{ github.action_path }}/prepare_action.py"'

    - name: Run GraphCheck
      shell: bash
      id: graphcheck_run
      env:
        GC_PROFILE: ${{ inputs.profile }}
        GC_FAIL_FAST: ${{ inputs.fail-fast }}
        GC_SUITE: ${{ inputs.suite }}
        GC_CONCURRENCY: ${{ inputs.concurrency }}
      run: |
        set +e
        args=(--profile "$GC_PROFILE")
        [ -n "$GC_SUITE" ] && args+=(--suite "$GC_SUITE")
        [ "$GC_FAIL_FAST" = "true" ] && args+=(--fail-fast)
        [ -n "$GC_CONCURRENCY" ] && args+=(--concurrency "$GC_CONCURRENCY")
        graphcheck run "${args[@]}"
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Clean up generated profiles.yml
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GENERATED_PROFILES: ${{ steps.generate_profile.outputs.generated_profiles }}
      run: |
        if [ "$GENERATED_PROFILES" = "true" ]; then
          rm -f profiles.yml
          echo "Removed generated profiles.yml"
        fi

    - name: Upload results
      if: always() && inputs.upload-artifacts != 'never' && (inputs.upload-artifacts == 'always' || steps.graphcheck_run.outputs.exit_code != '0')
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: graphcheck-results
        path: |
          ${{ env.GRAPHCHECK_ARTIFACTS_DIR }}/runs/latest/results.json
          ${{ env.GRAPHCHECK_ARTIFACTS_DIR }}/runs/latest/report.html
        if-no-files-found: ignore

    - name: Write summary
      if: always()
      continue-on-error: true
      shell: bash
      run: '"${GRAPHCHECK_ACTION_PYTHON:-python}" "${{ github.action_path }}/write_summary.py"'
      env:
        GRAPHCHECK_ARTIFACTS_DIR: ${{ env.GRAPHCHECK_ARTIFACTS_DIR }}

    - name: Set final job status
      if: always()
      shell: bash
      run: exit ${{ steps.graphcheck_run.outputs.exit_code || 3 }}
