name: 'GraphCheck'
description: 'Run GraphCheck checks against your graph and report results in the PR.'

inputs:
  profile:
    description: 'Profile name to generate and use, if profiles.yml does not already exist'
    required: false
    default: 'ci'
  uri:
    description: 'Neo4j Bolt URI (e.g. bolt://localhost:7687)'
    required: true
  user:
    description: 'Neo4j username'
    required: true
  database:
    description: 'Neo4j database name'
    required: false
    default: 'neo4j'
  fail-fast:
    description: 'Stop on the first failing check'
    required: false
    default: 'false'
  version:
    description: 'Exact GraphCheck version to install (e.g. 0.1.0)'
    required: false
    default: '0.1.0'

runs:
  using: 'composite'
  steps:
    - name: Install GraphCheck
      shell: bash
      run: pip install graphcheck==${{ inputs.version }}

    - name: Generate profiles.yml
      shell: bash
      run: |
        if [ -f profiles.yml ]; then
          echo "profiles.yml already exists, using it as-is."
        else
          echo "generated_profiles=true" >> "$GITHUB_ENV"
          {
            echo "default: ${{ inputs.profile }}"
            echo "profiles:"
            echo "  ${{ inputs.profile }}:"
            echo "    uri: ${{ inputs.uri }}"
            echo "    user: ${{ inputs.user }}"
            echo "    password: null"
            echo "    password_env: NEO4J_PASSWORD"
            echo "    database: ${{ inputs.database }}"
          } > profiles.yml
        fi

    - name: Run GraphCheck
      shell: bash
      id: graphcheck_run         
      run: |
        set +e
        graphcheck run \
          --profile "${{ inputs.profile }}" \
          $( [ "${{ inputs.fail-fast }}" = "true" ] && echo "--fail-fast" )
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Clean up generated profiles.yml
      if: always()
      shell: bash
      run: |
        if [ "$generated_profiles" = "true" ]; then
          rm -f profiles.yml
          echo "Removed generated profiles.yml"
        fi

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: graphcheck-results
        path: |
          .graphcheck/runs/latest/results.json
          .graphcheck/runs/latest/report.html
        if-no-files-found: ignore

    - name: Write summary
      if: always()
      shell: bash
      run: python .github/actions/graphcheck-action/write_summary.py

    - name: Set final job status
      if: always()
      shell: bash
      run: exit ${{ steps.graphcheck_run.outputs.exit_code }}