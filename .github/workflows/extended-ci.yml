name: Extended CI

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 3"

permissions:
  contents: read

jobs:
  hostile-neo4j44:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_ADDOPTS: --junitxml=.hostile-artifacts/neo4j-44.xml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - name: Certify graceful rejection of a Neo4j 4.4 cluster
        run: uv run python tools/run_hostile_graphs.py --case neo4j-4.4-cluster
      - name: Retain hostile-cluster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostile-neo4j-44
          path: .hostile-artifacts/
          if-no-files-found: warn

  first-run-linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: ubuntu:24.04
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    services:
      neo4j:
        image: neo4j:5.26.28
        env:
          NEO4J_AUTH: neo4j/graphora
          NEO4J_server_memory_heap_initial__size: 128m
          NEO4J_server_memory_heap_max__size: 256m
          NEO4J_server_memory_pagecache_size: 128m
    env:
      GRAPHCHECK_TELEMETRY: "0"
    steps:
      - name: Prepare clean Linux container
        run: apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl git socat
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel outside the measured install boundary
        run: uv build --wheel --out-dir "$RUNNER_TEMP/graphcheck-wheel"
      - name: Measure install -> init -> first valid run
        env:
          GRAPHCHECK_WHEEL_DIR: ${{ runner.temp }}/graphcheck-wheel
          FIRST_RUN_DIR: ${{ github.workspace }}/.first-run-artifacts/linux-container/${{ matrix.trial }}
          FIRST_RUN_PLATFORM: linux-container
          FIRST_RUN_TRIAL: ${{ matrix.trial }}
          FIRST_RUN_RUNNER_OS: Linux
          FIRST_RUN_RUNNER_IMAGE: ubuntu-24.04-container
          FIRST_RUN_TESTED_GITHUB_SHA: ${{ github.sha }}
          FIRST_RUN_PR_HEAD_SHA: ""
          FIRST_RUN_GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          socat TCP-LISTEN:7687,fork,reuseaddr TCP:neo4j:7687 &
          export GRAPHCHECK_BOOTSTRAP_PYTHON="$(uv python find 3.12)"
          bash .github/scripts/first-run.sh
      - name: Retain first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-linux-container-trial-${{ matrix.trial }}
          path: .first-run-artifacts/linux-container/${{ matrix.trial }}/
          if-no-files-found: warn

  first-run-macos:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    env:
      GRAPHCHECK_TELEMETRY: "0"
      NEO4J_VERSION: 5.26.28
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Build the wheel outside the measured install boundary
        run: uv build --wheel --out-dir "$RUNNER_TEMP/graphcheck-wheel"
      - name: Start a pinned native Neo4j
        run: |
          curl --fail --silent --show-error --location "https://dist.neo4j.org/neo4j-community-${NEO4J_VERSION}-unix.tar.gz" --output "$RUNNER_TEMP/neo4j.tar.gz"
          tar -xzf "$RUNNER_TEMP/neo4j.tar.gz" -C "$RUNNER_TEMP"
          neo4j_home="$RUNNER_TEMP/neo4j-community-${NEO4J_VERSION}"
          printf '\nserver.memory.heap.initial_size=128m\nserver.memory.heap.max_size=256m\nserver.memory.pagecache.size=128m\n' >> "$neo4j_home/conf/neo4j.conf"
          "$neo4j_home/bin/neo4j-admin" dbms set-initial-password graphora
          "$neo4j_home/bin/neo4j" start
          echo "NEO4J_HOME=$neo4j_home" >> "$GITHUB_ENV"
      - name: Measure install -> init -> first valid run
        env:
          GRAPHCHECK_WHEEL_DIR: ${{ runner.temp }}/graphcheck-wheel
          FIRST_RUN_DIR: ${{ github.workspace }}/.first-run-artifacts/macos/${{ matrix.trial }}
          FIRST_RUN_PLATFORM: macos
          FIRST_RUN_TRIAL: ${{ matrix.trial }}
          FIRST_RUN_RUNNER_OS: macOS
          FIRST_RUN_RUNNER_IMAGE: macos-15
          FIRST_RUN_TESTED_GITHUB_SHA: ${{ github.sha }}
          FIRST_RUN_PR_HEAD_SHA: ""
          FIRST_RUN_GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          export GRAPHCHECK_BOOTSTRAP_PYTHON="$(uv python find 3.12)"
          bash .github/scripts/first-run.sh
      - name: Retain first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-macos-trial-${{ matrix.trial }}
          path: .first-run-artifacts/macos/${{ matrix.trial }}/
          if-no-files-found: warn
      - name: Stop Neo4j
        if: always() && env.NEO4J_HOME != ''
        run: "$NEO4J_HOME/bin/neo4j stop"

  first-run-wsl:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Install a clean Ubuntu WSL environment
        uses: Vampire/setup-wsl@v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: ca-certificates curl openjdk-17-jre-headless python3 python3-pip python3-venv
          wsl-shell-user: runner
      - name: Install GraphCheck and run the timed first-run flow inside WSL
        shell: wsl-bash {0}
        run: |
          set -euo pipefail
          export GRAPHCHECK_TELEMETRY=0
          neo4j_version=5.26.28
          python3 -m venv /tmp/graphcheck-wheel-builder
          /tmp/graphcheck-wheel-builder/bin/pip wheel --disable-pip-version-check --no-deps --wheel-dir /tmp/graphcheck-wheel .
          curl --fail --silent --show-error --location "https://dist.neo4j.org/neo4j-community-${neo4j_version}-unix.tar.gz" --output /tmp/neo4j.tar.gz
          tar -xzf /tmp/neo4j.tar.gz -C /tmp
          neo4j_home="/tmp/neo4j-community-${neo4j_version}"
          printf '\nserver.memory.heap.initial_size=128m\nserver.memory.heap.max_size=256m\nserver.memory.pagecache.size=128m\n' >> "$neo4j_home/conf/neo4j.conf"
          "$neo4j_home/bin/neo4j-admin" dbms set-initial-password graphora
          "$neo4j_home/bin/neo4j" start
          trap '"$neo4j_home/bin/neo4j" stop' EXIT
          sed -i 's/\r$//' .github/scripts/first-run.sh
          export GRAPHCHECK_BOOTSTRAP_PYTHON=python3
          export GRAPHCHECK_WHEEL_DIR=/tmp/graphcheck-wheel
          export FIRST_RUN_DIR="$PWD/.first-run-artifacts/wsl/${{ matrix.trial }}"
          export FIRST_RUN_PLATFORM=wsl
          export FIRST_RUN_TRIAL=${{ matrix.trial }}
          export FIRST_RUN_RUNNER_OS=Windows/WSL
          export FIRST_RUN_RUNNER_IMAGE=windows-2025-ubuntu-24.04
          export FIRST_RUN_TESTED_GITHUB_SHA='${{ github.sha }}'
          export FIRST_RUN_PR_HEAD_SHA=
          export FIRST_RUN_GITHUB_EVENT_NAME='${{ github.event_name }}'
          bash .github/scripts/first-run.sh
      - name: Retain first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-wsl-trial-${{ matrix.trial }}
          path: .first-run-artifacts/wsl/${{ matrix.trial }}/
          if-no-files-found: warn

  first-run-summary:
    if: always()
    needs: [first-run-linux-container, first-run-macos, first-run-wsl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download first-run trial evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: first-run-*-trial-*
          path: .first-run-samples
      - name: Calculate and enforce platform medians
        run: python .github/scripts/first_run_evidence.py summarize --input .first-run-samples --output .first-run-summary
      - name: Add first-run medians to the run summary
        if: always()
        run: test ! -f .first-run-summary/first-run-summary.md || cat .first-run-summary/first-run-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain median first-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-run-summary
          path: .first-run-summary/
          if-no-files-found: warn

  performance-gates:
    runs-on: windows-latest
    env:
      GRAPHCHECK_PERFORMANCE_GATE: windows-amd64-python-3.12
      GRAPHCHECK_PERFORMANCE_OUTPUT: .performance-artifacts/cli-cold-start.json
    steps:
      - uses: actions/checkout@v4
      - name: Install uv with the reference Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Enforce cold CLI and logical memory budgets
        run: >
          uv run pytest
          tests/performance/test_cli_startup.py
          tests/performance/test_memory_gates.py
          tests/performance/test_regression_gates.py
          -v
      - name: Retain raw samples and gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-gates-windows-python-3.12
          path: .performance-artifacts/
          if-no-files-found: warn
