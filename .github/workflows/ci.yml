name: CI

on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-cache --group dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and select the matrix Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --no-cache --group dev
      - run: uv run --no-sync python -c "import click._textwrap, typer._click.decorators, typer.rich_utils; print('Typer and Click package integrity OK')"
      - run: uv run --no-sync python -c "import importlib.metadata as m; print('Typer:', m.version('typer')); print('Click:', m.version('click')); print('MCP:', m.version('mcp'))"
      - name: Assert the interpreter matches the matrix (guards against a single pinned run)
        env:
          WANT: ${{ matrix.python-version }}
        run: uv run --no-sync python -c "import os, sys; want=tuple(int(p) for p in os.environ['WANT'].split('.')); assert sys.version_info[:2]==want, sys.version"
      - run: uv run --no-sync pytest --cov=graphcheck --cov-report=term-missing --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GRAPHCHECK_NEO4J_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --no-cache --group dev
      - run: uv run --no-sync pytest tests/integration -v
