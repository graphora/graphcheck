  #       run: uv run --no-sync pytest --cov=graphcheck --cov-report=term-missing --cov-fail-under=80

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group dev
      - run: uv run pytest --cov=graphcheck --cov-report=term-missing --cov-fail-under=80

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        neo4j-target: [lts-cypher-5, current-cypher-5, current-cypher-25]
    env:
      GRAPHCHECK_NEO4J_INTEGRATION: "1"
      GRAPHCHECK_NEO4J_TARGET: ${{ matrix.neo4j-target }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run pytest tests/integration -v

  performance-gates:
    runs-on: windows-latest
    env:
      GRAPHCHECK_PERFORMANCE_GATE: windows-amd64-python-3.12
      GRAPHCHECK_PERFORMANCE_OUTPUT: .performance-artifacts/cli-cold-start.json
    steps:
      - uses: actions/checkout@v4
      - name: Install uv with the reference Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Enforce cold CLI and logical memory budgets
        run: >
          uv run pytest
          tests/performance/test_cli_startup.py
          tests/performance/test_memory_gates.py
          tests/performance/test_regression_gates.py
          -v
      - name: Retain raw samples and gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-gates-windows-python-3.12
          path: .performance-artifacts/
          if-no-files-found: warn

  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - run: uv venv .wheel-venv
      - run: uv pip install --python .wheel-venv/bin/python dist/*.whl
      - run: .wheel-venv/bin/graphcheck --version
      - run: .wheel-venv/bin/graphcheck --help
      - name: Verify installed package resources
        run: .wheel-venv/bin/python -c "from importlib.resources import files; assert files('graphcheck').joinpath('packs/core.yml').is_file(); assert files('graphcheck').joinpath('packs/pii.yml').is_file()"
